<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Phiếu Đặt Hàng</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        @page { size: A4; margin: 0; }

        body {
            font-family: 'Roboto', Arial, sans-serif;
            font-size: 13px;
            color: #111;
            background: #fff;
        }

        /* ── TRANG ── */
        .page {
            width: 210mm;
            min-height: 297mm;
            padding: 7mm 12mm 7mm 12mm;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .page-break {
            page-break-after: always;
            break-after: page;
        }

        /* ── PAGE NUMBER — góc phải trên ── */
        .page-num {
            position: absolute;
            bottom: 20px;

            left: 12mm;
            width: calc(100% - 24mm);

            text-align: center;

            font-size: 11px;
            color: #666;
            font-weight: 600;
        }

        /* ── HEADER ── */
        .header { display: flex; align-items: center; margin-bottom: 10px; }
        .header-left { width: 28%; }
        .header-left img { height: 50px; width: auto; display: block; }
        .header-center { flex: 1; text-align: center; }
        .doc-title {
            font-family: 'Roboto', Arial, sans-serif;
            font-size: 28px; font-weight: 900;
            text-transform: uppercase; letter-spacing: 3px;
        }
        .header-right { width: 22%; text-align: right; font-size: 13px; font-weight: 700; }
        .doc-id-num { color: #c00; font-weight: 900; font-size: 16px; }

        /* ── TOP INFO ── */
        .top-info-table {
            width: 100%; border-collapse: collapse;
            margin-bottom: 7px; font-size: 13px;
        }

        .top-info-table td { padding: 0 10px; vertical-align: top; }
        .lbl { font-weight: 700; white-space: nowrap; }
        .customer-info { font-size: 18px;font-weight: 900;}
        .val { border-bottom: 1px dotted #666; min-width: 200px; }
        .col-l { width: 52%; }
        .col-r { width: 48%; }

        /* ── ITEMS TABLE ──
           Mã số 5% | Tên hàng 42.5% | QC 8% | ĐVT 7% | SL 7% | Đơn giá 12% | Thành tiền 18.5%
        ── */
        table.items {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            border: 1px solid #222;
            flex-shrink: 0;
        }
        table.items th {
            border: 1px solid #222;
            padding: 6px 5px;
            text-align: center;
            font-weight: 700; font-size: 13px;
            background: #fff;
        }
        table.items td {
            border-top:    1px dashed #bbb;
            border-bottom: 1px dashed #bbb;
            border-left:   1px solid #333;
            border-right:  1px solid #333;
            padding: 4px 5px;
            vertical-align: middle;
            height: 30px;
            font-size: 13px;
            line-height: 1.3;
        }
        table.items tbody tr:first-child td { border-top: 1px solid #222; }
        table.items tbody tr:last-child td  { border-bottom: 1px solid #222; }
        table.items td.c { text-align: center; }
        table.items td.r { text-align: right; }

        table.items td.dvt,
        table.items td.sl {
            font-size: 15px;
            font-weight: 700;
        }

        table.items tr.blank td {
            border-top:    1px dashed #ccc;
            border-bottom: 1px dashed #ccc;
            border-left:   1px solid #333;
            border-right:  1px solid #333;
            height: 30px;
        }
        table.items tbody tr.blank:last-child td { border-bottom: 1px solid #222; }

        /* ── SUMMARY ── */
        table.summary-wrapper {
            width: 100%; border-collapse: collapse;
            margin-top: 0; table-layout: fixed;
        }
        table.summary-wrapper td { padding: 0; border: none; }
        table.summary-inner {
            width: 100%; border-collapse: collapse;
            table-layout: fixed; font-size: 13px;
        }
        table.summary-inner td.sum-lbl {
            width: 50%; text-align: right;
            background: #fff; border: 1px solid #444;
            padding: 5px 7px; overflow: hidden;
        }
        table.summary-inner td.sum-val {
            width: 50%; text-align: right;
            border: 1px solid #444; padding: 5px 7px; overflow: hidden;
        }
        table.summary-inner tr.grand-total td {
            font-weight: 400; font-size: 15px; border: 1px solid #111;
            background: #fff;
        }

        /* ── TOTAL WORDS ── */
        .total-words {
            font-size: 13px; margin-top: 7px; margin-bottom: 8px;
        }
        .total-words-label { font-style: italic; display: block; margin-bottom: 2px; }
        .dotline {
            display: block; border-bottom: 1px dotted #666;
            width: 100%; margin-top: 5px;
        }

        /* ── SIGNATURES — luôn gần sát đáy trang ── */
        .sig-row {
            display: flex;
            margin-top: auto;
            padding-top: 10px;
            text-align: center;
        }
        .sig-cell { flex: 1; padding: 0 3px; }
        .sig-title {
            font-weight: 700; font-size: 13px;
            border-top: 1.2px solid #222; padding-top: 4px;
        }
        .sig-name {
            font-size: 12px; font-style: italic; color: #555;
            margin-top: 2px; min-height: 30px;
        }
    </style>
</head>
<body>
{{pages}}
</body>
</html>
